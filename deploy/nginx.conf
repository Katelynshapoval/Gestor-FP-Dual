# Serves the React build and forwards everything else to the API.
#
# The API has no /api prefix and shares paths with the app's pages
# (/reservas, /documentos, /panel...). Like the CRA dev proxy, a GET/HEAD
# whose Accept header asks for HTML is a page load and gets index.html;
# every other request (fetch() calls, uploads, downloads) goes to the API.

map $http_accept $accepts_html {
    default       0;
    "~*text/html" 1;
}

map "$request_method:$accepts_html" $page_load {
    default  0;
    "GET:1"  1;
    "HEAD:1" 1;
}

# Only Caddy (docker-compose.yml) can reach this server, so the client
# address it sends is trusted and becomes $remote_addr.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# Content-Security-Policy for the app's pages. The session token lives in
# localStorage, so this is what stops an injected script from running and
# reading it. Scripts only from this origin (the build sets
# INLINE_RUNTIME_CHUNK=false so there is no inline script); styles allow
# inline because React sets style attributes; Google Fonts for Roboto; blob:
# for the PDF viewer, which shows downloaded files in an iframe.
map $host $page_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream api {
    server backend:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # PDF uploads are capped at 10 MB by the API (pdfUpload.js).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The site root is always the app.
    location = / {
        error_page 418 = @page;
        return 418;
    }

    # Files from the build (logo, images, manifest). API answers keep the
    # API's own headers (src/index.js), so these are set per location.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $page_csp always;
        error_page 418 = @page;
        if ($page_load) { return 418; }
        try_files $uri @api;
    }

    location @page {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $page_csp always;
    }

    location @api {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the API trusts exactly one proxy (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # PDF generation runs Chromium and can take a while.
        proxy_read_timeout 120s;
    }
}
