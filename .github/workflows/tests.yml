# Runs the backend and frontend tests on every push and pull request.
# No database is needed: the database integration tests (backend/test/db)
# only run with DB_INTEGRATION=1, which is not set here.
# Node 24 (npm 11), as in development: the lockfiles are written by npm 11,
# and npm 10's `npm ci` rejects them (it wants optional peers such as yaml@2).
name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests never generate PDFs, so the browser Puppeteer downloads is not needed.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      NODE_ENV: test
      # Placeholder only (the app requires 32+ characters); each test file sets its own.
      JWT_SECRET: ci-placeholder-value-not-used-anywhere-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Runs every test and prints the coverage table; fails if coverage drops
      # below the minimum in package.json (test:coverage).
      - run: npm run test:coverage

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fails on any lint warning (the check react-scripts used to run in the build).
      - run: npm run lint
      # Runs every test (Vitest) and prints the coverage table; fails if coverage
      # drops below the minimum in vite.config.js (test.coverage.thresholds).
      - run: npm run test:coverage
      - run: npm run build
